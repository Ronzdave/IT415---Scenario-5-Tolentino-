<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event &amp; Attendance Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">

  <!-- ============ HEADER ============ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">EA</span>
      <div>
        <h1 class="page-title">Event &amp; Attendance Manager</h1>
        <p class="page-sub">Student Organization — Ronian Dave P. Tolentino</p>
      </div>
    </div>
    <nav class="tabs" aria-label="Views">
      <button class="tab active" data-view="events" type="button">Events</button>
      <button class="tab" data-view="report" type="button">Report</button>
    </nav>
  </header>

  <main class="content">

    <!-- ============ EVENTS VIEW ============ -->
    <section id="view-events" class="view">

      <!-- Event form -->
      <div class="panel">
        <div class="panel-head">
          <h2 class="panel-title" id="event-form-title">Add Event</h2>
        </div>
        <form id="event-form" class="form-grid" autocomplete="off">
          <input type="hidden" id="event-id" />
          <label>Name <input type="text" id="e-name" placeholder="e.g. Tech Summit" /></label>
          <label>Date <input type="date" id="e-date" /></label>
          <label>Venue <input type="text" id="e-venue" placeholder="e.g. Main Hall" /></label>
          <label>Capacity <input type="number" id="e-capacity" min="1" placeholder="e.g. 50" /></label>
          <label>Status
            <select id="e-status">
              <option value="Draft">Draft</option>
              <option value="Open for Registration">Open for Registration</option>
              <option value="Closed">Closed</option>
              <option value="Completed">Completed</option>
            </select>
          </label>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit" id="event-submit">Add Event</button>
            <button class="btn btn-ghost hidden" type="button" id="event-cancel">Cancel</button>
          </div>
        </form>
        <p class="form-msg" id="event-msg" role="status"></p>
      </div>

      <!-- Status filter -->
      <div class="toolbar">
        <label class="inline">List events by status:
          <select id="status-list-filter">
            <option value="All">All</option>
            <option value="Draft">Draft</option>
            <option value="Open for Registration">Open for Registration</option>
            <option value="Closed">Closed</option>
            <option value="Completed">Completed</option>
          </select>
        </label>
      </div>

      <!-- Event list -->
      <div id="event-list" class="event-list"></div>
    </section>

    <!-- ============ REGISTRATIONS VIEW ============ -->
    <section id="view-registrations" class="view hidden">
      <button class="btn btn-ghost" type="button" id="back-to-events">← Back to events</button>

      <div class="panel">
        <div class="panel-head">
          <div>
            <h2 class="panel-title" id="reg-event-name">Event</h2>
            <p class="panel-sub" id="reg-event-meta"></p>
          </div>
        </div>

        <!-- live counts -->
        <div class="stats" id="reg-stats"></div>

        <!-- Registration form -->
        <form id="reg-form" class="form-grid" autocomplete="off">
          <label>Student name <input type="text" id="r-name" placeholder="Full name" /></label>
          <label>Student ID <input type="text" id="r-id" placeholder="e.g. 2021-00123" /></label>
          <label>Year level
            <select id="r-year">
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
          </label>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Register student</button>
          </div>
        </form>
        <p class="form-msg" id="reg-msg" role="status"></p>
      </div>

      <!-- Search / filter registrations -->
      <div class="toolbar">
        <div class="search">
          <input type="search" id="reg-search" placeholder="Search by name or student ID…" />
        </div>
        <label class="inline">Attendance:
          <select id="reg-att-filter">
            <option value="All">All</option>
            <option value="Present">Present</option>
            <option value="Absent">Not present</option>
          </select>
        </label>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Student</th>
              <th>Student ID</th>
              <th>Year</th>
              <th>Date registered</th>
              <th>Attendance</th>
              <th class="col-actions">Actions</th>
            </tr>
          </thead>
          <tbody id="reg-body"></tbody>
        </table>
        <div class="empty-state hidden" id="reg-empty"><p>No registrations match.</p></div>
      </div>
    </section>

    <!-- ============ REPORT VIEW ============ -->
    <section id="view-report" class="view hidden">
      <div class="panel">
        <div class="panel-head"><h2 class="panel-title">Events per status</h2></div>
        <div class="stats" id="report-status"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 class="panel-title">Best completed event</h2></div>
        <p class="panel-sub">Completed event with the highest attendance rate.</p>
        <div id="report-best"></div>
      </div>
    </section>

  </main>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
